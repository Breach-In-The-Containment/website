server {
    listen 80;
    server_name localhost;

    # Where the website files live inside the container
    root /usr/share/nginx/html;
    index index.html;

    # Look for files, if not found, fallback to the 404 error page
    location / {
        try_files $uri $uri/ =404;
    }

    # Configure the custom 404 page (just like GitHub Pages does)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}